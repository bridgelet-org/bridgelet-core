[package]
name = "ephemeral_account"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
bridgelet-shared = { path = "../shared", version = "0.1.0" }


[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
reserve_contract = { path = "../reserve_contract", version = "0.1.0" }
# Pin to the version Cargo.lock already records for the workspace (`1.11.0`).
# Required by `contracts/ephemeral_account/tests/property_tests.rs`
proptest = "1.11"
