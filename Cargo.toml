[workspace]
resolver = "2"
members = [
    "contracts/ephemeral_account",
    "contracts/sweep_controller",
    "contracts/shared",
    "contracts/reserve_contract",
    "contracts/account_factory",
    "contracts/rate_limiter",
    "contracts/pause_guardian",
    "contracts/timelock_controller",
    "contracts/multisig_approval",
    "contracts/fee_splitter",
    "contracts/nonce_registry",
    "contracts/allowlist_registry",
    "contracts/audit_log",
    "contracts/version_registry",
    "contracts/asset_allowlist",
    "contracts/access_controller",
    "contracts/compliance_oracle",
    "contracts/claimable_balance_registry",
    "contracts/expiry_scheduler",
    "contracts/notification_registry",
    "contracts/escrow_vault",
]

# Issues #41 / #42: soroban-sdk is pinned to 22.0.0 in exactly one place — here.
# Every workspace member inherits it via `soroban-sdk = { workspace = true }`,
# so no contract declares its own version. See docs/soroban-sdk-version-policy.md
# for the upgrade process (bump here only, then verify on testnet before merge).
[workspace.dependencies]
soroban-sdk = "=22.0.11"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
